# ==============================================================================
# FREA (.pre-commit-config.yaml) - Pre-commit Git Hook Configuration
# ==============================================================================

default_language_version:
  python: python3

repos:
  # General File Hygiene & Git Sanity Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Python Linting & Formatting via Ruff (High-Speed)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Security & Secret Scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Local Protocol & Quality Enforcement
  - repo: local
    hooks:
      - id: caveman-audit
        name: Caveman Protocol Audit (YAGNI & Efficiency)
        entry: python3 /home/azzar/.agents/skills/caveman/scripts/audit.py
        language: system
        types_or: [python, markdown]
